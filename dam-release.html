<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yall Too — Dam Release</title>
<style>
:root{--cyan:#2fd2ff;--indigo:#3d3dea;--magenta:#f310ba;--pink:#ff9df2;--stone-light:#9aa0ab;--stone-dark:#565b66}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:system-ui,sans-serif}
.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
.frame{position:relative;width:min(96vw,177.78vh);aspect-ratio:16/9}
svg{width:100%;height:100%;display:block;overflow:visible}
.toggle{position:absolute;top:5%;right:4%;width:clamp(34px,4.2vw,46px);height:clamp(88px,11vw,120px);border-radius:999px;background:linear-gradient(180deg,#1c2130,#2a3145);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.35);cursor:pointer;padding:5px;display:flex;flex-direction:column;align-items:center}
.toggle-label{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:clamp(.6rem,1.1vw,.72rem);font-weight:700;letter-spacing:.04em;color:#e8eaf2;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px;white-space:nowrap}
.thumb{width:calc(100% - 6px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--magenta),var(--indigo) 75%);box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.35);transition:transform .45s cubic-bezier(.34,1.4,.64,1);display:flex;align-items:center;justify-content:center}
.thumb svg{width:52%;height:52%;stroke:#fff;fill:none;stroke-width:2.4;overflow:visible}
.scene.off .thumb{transform:translateY(calc(100% + 0px))}.scene.on .thumb{transform:translateY(0)}
.res-wave{animation:flowRes 5s linear infinite}.res-wave.w2{animation-duration:7s;animation-direction:reverse}@keyframes flowRes{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.pool-wave{animation:flowPool 3.4s linear infinite}.pool-wave.w2{animation-duration:4.6s;animation-direction:reverse}@keyframes flowPool{from{transform:translateX(0)}to{transform:translateX(-48px)}}
.gate-leaf{transition:transform .5s cubic-bezier(.5,0,.2,1)}.scene.off .gate-leaf{transform:translateY(0)}.scene.on .gate-leaf{transform:translateY(-46px)}
.gate-chevron{animation:chevronFlow .8s linear infinite;animation-play-state:paused}.scene.on .gate-chevron{animation-play-state:running}.gate-chevron.g2{animation-delay:.27s}.gate-chevron.g3{animation-delay:.53s}@keyframes chevronFlow{0%{transform:translateX(-16px);opacity:0}20%{opacity:1}75%{opacity:1}100%{transform:translateX(66px);opacity:0}}
.stream-group{opacity:0;transition:opacity .35s ease}.scene.on .stream-group{opacity:1}
.streak{animation:streakFlow .9s linear infinite;animation-play-state:paused}.scene.on .streak{animation-play-state:running}.streak.s2{animation-delay:.22s}.streak.s3{animation-delay:.44s}.streak.s4{animation-delay:.66s}@keyframes streakFlow{0%{transform:translate(0,0);opacity:0}12%{opacity:.95}100%{transform:translate(150px,190px);opacity:0}}
.mist{animation:mistPuff 1.6s ease-out infinite;animation-play-state:paused}.scene.on .mist{animation-play-state:running}.mist.m2{animation-delay:.5s}.mist.m3{animation-delay:1s}@keyframes mistPuff{0%{transform:scale(.4) translateY(0);opacity:0}30%{opacity:.55}100%{transform:scale(1.5) translateY(-18px);opacity:0}}
.splash-ring{animation:splashRing 1.1s ease-out infinite;animation-play-state:paused}.scene.on .splash-ring{animation-play-state:running}.splash-ring.r2{animation-delay:.55s}@keyframes splashRing{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1.9);opacity:0}}
.splash-drop{animation:splashDrop 1s ease-out infinite;animation-play-state:paused}.scene.on .splash-drop{animation-play-state:running}.splash-drop.d2{animation-delay:.33s}.splash-drop.d3{animation-delay:.66s}@keyframes splashDrop{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
@media(prefers-reduced-motion:reduce){.res-wave,.pool-wave,.streak,.mist,.splash-ring,.splash-drop{animation:none!important}}
</style>
</head>
<body>
<div class="stage"><div class="frame">
<svg viewBox="0 0 960 540" class="scene on" id="scene">
<defs>
<linearGradient id="stoneGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--stone-light)"/><stop offset="1" stop-color="var(--stone-dark)"/></linearGradient>
<linearGradient id="gateGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--indigo)"/><stop offset="1" stop-color="#241f8f"/></linearGradient>
<clipPath id="frameClip"><rect x="0" y="0" width="960" height="540"/></clipPath><clipPath id="resClip"><rect x="0" y="120" width="410" height="330"/></clipPath><clipPath id="poolClip"><rect x="470" y="360" width="490" height="180"/></clipPath><clipPath id="gateSlotClip"><rect x="392" y="330" width="64" height="86" rx="4"/></clipPath>
</defs>
<g clip-path="url(#frameClip)">
<g clip-path="url(#resClip)"><rect x="0" y="150" width="410" height="300" fill="#1c2fae" opacity=".28"/><path class="res-wave w2" fill="#213bc9" opacity=".55" d="M-60,168 Q-30,150 0,168 T60,168 T120,168 T180,168 T240,168 T300,168 T360,168 T420,168 T480,168 V460 H-60 Z"/><path class="res-wave w1" fill="#2fd2ff" opacity=".6" d="M-60,182 Q-30,162 0,182 T60,182 T120,182 T180,182 T240,182 T300,182 T360,182 T420,182 T480,182 V460 H-60 Z"/></g>
<g><path d="M390,90 L470,130 L470,480 L390,500 Z" fill="url(#stoneGrad)"/><path d="M390,90 L470,130 L470,150 L390,110 Z" fill="#c3c8d1"/><rect x="392" y="140" width="18" height="330" fill="var(--indigo)" opacity=".85"/><rect x="412" y="140" width="6" height="330" fill="var(--magenta)" opacity=".8"/><rect x="392" y="330" width="64" height="86" rx="4" fill="#20222b"/><rect x="392" y="330" width="64" height="86" rx="4" fill="none" stroke="var(--pink)" stroke-width="3" opacity=".8"/></g>
<g clip-path="url(#gateSlotClip)"><g transform="translate(394,348)"><g class="gate-chevron g1"><path d="M0,-6 L8,0 L0,6" fill="none" stroke="#eaf9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(394,373)"><g class="gate-chevron g2"><path d="M0,-6 L8,0 L0,6" fill="none" stroke="var(--cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(394,398)"><g class="gate-chevron g3"><path d="M0,-6 L8,0 L0,6" fill="none" stroke="#eaf9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>
<g clip-path="url(#frameClip)"><rect class="gate-leaf" x="396" y="334" width="56" height="78" rx="2" fill="url(#gateGrad)"/><g class="gate-leaf"><rect x="396" y="334" width="56" height="6" fill="var(--cyan)" opacity=".9"/><rect x="396" y="352" width="56" height="4" fill="#12143a" opacity=".5"/><rect x="396" y="366" width="56" height="4" fill="#12143a" opacity=".5"/><rect x="396" y="380" width="56" height="4" fill="#12143a" opacity=".5"/><rect x="396" y="394" width="56" height="4" fill="#12143a" opacity=".5"/></g></g>
<g class="stream-group"><clipPath id="streamClip"><path d="M410,370 Q470,380 520,430 Q555,465 555,510 L410,510 Z"/></clipPath><g clip-path="url(#streamClip)"><rect x="380" y="360" width="230" height="160" fill="var(--cyan)" opacity=".5"/><g class="streak s1"><g transform="translate(418,378) rotate(51.7)"><polygon points="10,0 -6,-5 -6,5" fill="#eaf9ff"/></g></g><g class="streak s2"><g transform="translate(418,378) rotate(51.7)"><polygon points="10,0 -6,-5 -6,5" fill="#eaf9ff"/></g></g><g class="streak s3"><g transform="translate(418,378) rotate(51.7)"><polygon points="10,0 -6,-5 -6,5" fill="#eaf9ff"/></g></g><g class="streak s4"><g transform="translate(418,378) rotate(51.7)"><polygon points="10,0 -6,-5 -6,5" fill="var(--cyan)"/></g></g></g><circle class="mist m1" cx="420" cy="372" r="10" fill="#eaf9ff"/><circle class="mist m2" cx="428" cy="376" r="8" fill="#eaf9ff"/><circle class="mist m3" cx="412" cy="380" r="9" fill="#eaf9ff"/></g>
<g clip-path="url(#poolClip)"><rect x="470" y="380" width="490" height="160" fill="#1c2fae" opacity=".22"/><path class="pool-wave w2" fill="#213bc9" opacity=".5" d="M420,398 Q444,382 468,398 T516,398 T564,398 T612,398 T660,398 T708,398 T756,398 T804,398 T852,398 T900,398 T948,398 V540 H420 Z"/><path class="pool-wave w1" fill="#2fd2ff" opacity=".55" d="M420,410 Q444,394 468,410 T516,410 T564,410 T612,410 T660,410 T708,410 T756,410 T804,410 T852,410 T900,410 T948,410 V540 H420 Z"/><g class="stream-group"><ellipse class="splash-ring r1" cx="540" cy="418" rx="26" ry="9" fill="none" stroke="#eaf9ff" stroke-width="2.4"/><ellipse class="splash-ring r2" cx="540" cy="418" rx="26" ry="9" fill="none" stroke="var(--cyan)" stroke-width="2.4"/><circle class="splash-drop d1" cx="522" cy="410" r="3" fill="#eaf9ff"/><circle class="splash-drop d2" cx="540" cy="406" r="3.4" fill="#eaf9ff"/><circle class="splash-drop d3" cx="556" cy="410" r="3" fill="#eaf9ff"/></g></g>
</g></svg>
<div class="toggle" id="toggle" role="button" aria-pressed="true" aria-label="Toggle dam release"><span class="toggle-label" id="toggleLabel">RELEASE</span><div class="thumb"><svg viewBox="0 0 24 24"><path d="M12 3c-3 4-6 7.2-6 10.5A6 6 0 0 0 18 13.5C18 10.2 15 7 12 3Z"/></svg></div></div>
</div></div>
<script>
const scene=document.getElementById('scene'),toggle=document.getElementById('toggle'),label=document.getElementById('toggleLabel');
function setState(on){scene.classList.toggle('on',on);scene.classList.toggle('off',!on);toggle.setAttribute('aria-pressed',on?'true':'false');label.textContent=on?'RELEASE':'STOP'}
toggle.addEventListener('click',()=>setState(!scene.classList.contains('on')));setState(true);
</script>
</body>
</html>
