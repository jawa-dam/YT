<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yall Too — Dam Release</title>
<style>
  :root{
    --cyan:#2fd2ff;
    --indigo:#3d3dea;
    --magenta:#f310ba;
    --pink:#ff9df2;
    --concrete:#8b909a;
    --concrete-dark:#5c616c;
    --concrete-deep:#3e434c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:transparent;
    overflow:hidden;
    font-family:system-ui,sans-serif;
  }
  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame{
    position:relative;
    width:min(96vw, 177.78vh);
    aspect-ratio:16/9;
  }
  svg{
    width:100%;height:100%;
    display:block;
    overflow:hidden;
  }

  /* ---------- toggle ---------- */
  .toggle{
    position:absolute;
    top:5%;
    right:4%;
    width:clamp(34px,4.2vw,46px);
    height:clamp(88px,11vw,120px);
    border-radius:999px;
    background:linear-gradient(180deg,#1c2130,#2a3145);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.12), 0 4px 10px rgba(0,0,0,.35);
    cursor:pointer;
    padding:5px;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:5;
  }
  .toggle-label{
    position:absolute;
    top:-22px;left:50%;transform:translateX(-50%);
    font-size:clamp(.6rem,1.1vw,.72rem);
    font-weight:700;
    letter-spacing:.04em;
    color:#e8eaf2;
    background:rgba(0,0,0,.35);
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .thumb{
    width:calc(100% - 6px);
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--magenta), var(--indigo) 75%);
    box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.35);
    transition:transform .45s cubic-bezier(.34,1.4,.64,1);
    display:flex;align-items:center;justify-content:center;
  }
  .thumb svg{width:52%;height:52%;stroke:#fff;fill:none;stroke-width:2.4;overflow:visible;}
  .scene.off .thumb{ transform:translateY(calc(100% + 0px)); }
  .scene.on  .thumb{ transform:translateY(0); }

  /* reservoir surface drift */
  .res-wave{animation:flowRes 6s linear infinite;}
  .res-wave.w2{animation-duration:9s;animation-direction:reverse;}
  .res-wave.w3{animation-duration:12s;}
  @keyframes flowRes{ from{transform:translateX(0);} to{transform:translateX(-80px);} }

  .pool-wave{animation:flowPool 4s linear infinite;}
  .pool-wave.w2{animation-duration:5.5s;animation-direction:reverse;}
  @keyframes flowPool{ from{transform:translateX(0);} to{transform:translateX(-56px);} }

  /* gate leaf rises to open */
  .gate-leaf{ transition:transform .7s cubic-bezier(.4,0,.2,1); }
  .scene.off .gate-leaf{ transform:translateY(0); }
  .scene.on  .gate-leaf{ transform:translateY(-72px); }

  /* hoist cables follow gate */
  .hoist-line{ transition:transform .7s cubic-bezier(.4,0,.2,1); transform-origin:center top; }
  .scene.off .hoist-line{ transform:scaleY(1); }
  .scene.on  .hoist-line{ transform:scaleY(0.22); }

  /* flow only while open */
  .stream-group{ opacity:0; transition:opacity .4s ease .15s; pointer-events:none; }
  .scene.on .stream-group{ opacity:1; }

  .jet-core{
    animation:jetShimmer 1.1s ease-in-out infinite;
    animation-play-state:paused;
  }
  .scene.on .jet-core{ animation-play-state:running; }
  @keyframes jetShimmer{
    0%,100%{ opacity:.72; }
    50%{ opacity:.95; }
  }

  .streak{
    animation:streakFlow .85s linear infinite;
    animation-play-state:paused;
  }
  .scene.on .streak{ animation-play-state:running; }
  .streak.s2{animation-delay:.14s;}
  .streak.s3{animation-delay:.28s;}
  .streak.s4{animation-delay:.42s;}
  .streak.s5{animation-delay:.56s;}
  .streak.s6{animation-delay:.70s;}
  @keyframes streakFlow{
    0%{ transform:translate(0,0); opacity:0; }
    10%{ opacity:.9; }
    100%{ transform:translate(118px,155px); opacity:0; }
  }

  .sheet-line{
    animation:sheetPulse 1.2s ease-in-out infinite;
    animation-play-state:paused;
  }
  .scene.on .sheet-line{ animation-play-state:running; }
  .sheet-line.l2{animation-delay:.4s;}
  @keyframes sheetPulse{
    0%,100%{ opacity:.25; }
    50%{ opacity:.55; }
  }

  .mist{
    animation:mistPuff 1.5s ease-out infinite;
    animation-play-state:paused;
  }
  .scene.on .mist{ animation-play-state:running; }
  .mist.m2{animation-delay:.4s;}
  .mist.m3{animation-delay:.8s;}
  .mist.m4{animation-delay:1.1s;}
  @keyframes mistPuff{
    0%{ transform:scale(.35) translate(0,0); opacity:0; }
    25%{ opacity:.5; }
    100%{ transform:scale(1.8) translate(8px,-22px); opacity:0; }
  }

  .splash-ring{
    animation:splashRing 1.15s ease-out infinite;
    animation-play-state:paused;
  }
  .scene.on .splash-ring{ animation-play-state:running; }
  .splash-ring.r2{animation-delay:.38s;}
  .splash-ring.r3{animation-delay:.76s;}
  @keyframes splashRing{
    0%{ transform:scale(.25); opacity:.75; }
    100%{ transform:scale(2.1); opacity:0; }
  }

  .splash-drop{
    animation:splashDrop .95s ease-out infinite;
    animation-play-state:paused;
  }
  .scene.on .splash-drop{ animation-play-state:running; }
  .splash-drop.d2{animation-delay:.2s;}
  .splash-drop.d3{animation-delay:.4s;}
  .splash-drop.d4{animation-delay:.6s;}
  .splash-drop.d5{animation-delay:.8s;}
  @keyframes splashDrop{
    0%{ transform:translate(0,0); opacity:0; }
    12%{ opacity:1; }
    100%{ transform:translate(var(--dx,0px), -36px); opacity:0; }
  }

  .boil{
    animation:boil 1.4s ease-in-out infinite;
    animation-play-state:paused;
  }
  .scene.on .boil{ animation-play-state:running; }
  .boil.b2{animation-delay:.45s;}
  .boil.b3{animation-delay:.9s;}
  @keyframes boil{
    0%,100%{ transform:translateY(0) scaleX(1); opacity:.35; }
    50%{ transform:translateY(-6px) scaleX(1.08); opacity:.7; }
  }

  .foam-patch{
    animation:foamDrift 3.2s linear infinite;
    animation-play-state:paused;
  }
  .scene.on .foam-patch{ animation-play-state:running; }
  .foam-patch.f2{animation-delay:1.1s;}
  @keyframes foamDrift{
    from{ transform:translateX(0); opacity:.5; }
    to{ transform:translateX(40px); opacity:.15; }
  }

  @media (prefers-reduced-motion: reduce){
    .res-wave,.pool-wave,.streak,.mist,.splash-ring,.splash-drop,.jet-core,.sheet-line,.boil,.foam-patch{
      animation:none !important;
    }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="frame">
    <svg viewBox="0 0 960 540" class="scene on" id="scene">
      <defs>
        <!-- sky -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7eb3d9"/>
          <stop offset=".45" stop-color="#b7d4ea"/>
          <stop offset="1" stop-color="#dce9f4"/>
        </linearGradient>

        <!-- hills -->
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6d7f6a"/>
          <stop offset="1" stop-color="#4f5e4c"/>
        </linearGradient>
        <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5a6b52"/>
          <stop offset="1" stop-color="#3d4a38"/>
        </linearGradient>

        <!-- reservoir depth -->
        <linearGradient id="resDepth" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4ec4ef"/>
          <stop offset=".35" stop-color="#2a7fd4"/>
          <stop offset=".7" stop-color="#1a4fa8"/>
          <stop offset="1" stop-color="#123 dig" stop-color="#0f2f6a"/>
        </linearGradient>
        <linearGradient id="resDepthFixed" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5ecaf0"/>
          <stop offset=".3" stop-color="#2f86d6"/>
          <stop offset=".65" stop-color="#1b52aa"/>
          <stop offset="1" stop-color="#102e68"/>
        </linearGradient>

        <!-- pool depth -->
        <linearGradient id="poolDepth" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#49b8e8"/>
          <stop offset=".4" stop-color="#2a6fc0"/>
          <stop offset="1" stop-color="#163a7a"/>
        </linearGradient>

        <!-- concrete face (slight vertical weathering) -->
        <linearGradient id="damFace" x1="0" y1="0" x2="1" y2="0.15">
          <stop offset="0" stop-color="#a7adb8"/>
          <stop offset=".2" stop-color="#8f96a1"/>
          <stop offset=".55" stop-color="#6f7682"/>
          <stop offset="1" stop-color="#4d535e"/>
        </linearGradient>
        <linearGradient id="damFaceSide" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#6a707a"/>
          <stop offset="1" stop-color="#3a3f48"/>
        </linearGradient>
        <linearGradient id="crestGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c5cad3"/>
          <stop offset="1" stop-color="#8b919c"/>
        </linearGradient>
        <linearGradient id="gateSteel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4a5168"/>
          <stop offset=".4" stop-color="#2e3344"/>
          <stop offset="1" stop-color="#1a1d28"/>
        </linearGradient>
        <linearGradient id="gateHighlight" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#6d7690"/>
          <stop offset=".5" stop-color="#3a4156"/>
          <stop offset="1" stop-color="#252a38"/>
        </linearGradient>
        <linearGradient id="jetGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#eaf9ff"/>
          <stop offset=".35" stop-color="#7adfff"/>
          <stop offset=".7" stop-color="#2fd2ff"/>
          <stop offset="1" stop-color="#1a8fd0"/>
        </linearGradient>
        <linearGradient id="rockGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6d655c"/>
          <stop offset="1" stop-color="#3f3a34"/>
        </linearGradient>
        <linearGradient id="bankGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6a5a48"/>
          <stop offset="1" stop-color="#3d342a"/>
        </linearGradient>

        <pattern id="formTies" width="18" height="28" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="6" r="1.1" fill="#3a3f48" opacity=".35"/>
          <circle cx="12" cy="20" r="1.1" fill="#3a3f48" opacity=".28"/>
        </pattern>
        <pattern id="gateRibs" width="56" height="12" patternUnits="userSpaceOnUse">
          <rect x="0" y="0" width="56" height="2.5" fill="#0d0f16" opacity=".55"/>
          <rect x="0" y="3" width="56" height="1" fill="#7a849c" opacity=".25"/>
        </pattern>

        <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.2"/>
        </filter>
        <filter id="mistBlur" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="3.5"/>
        </filter>
        <filter id="waterBlur" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="0.8"/>
        </filter>

        <clipPath id="frameClip"><rect width="960" height="540"/></clipPath>
        <clipPath id="resClip"><path d="M0,130 L398,130 L398,500 L0,500 Z"/></clipPath>
        <clipPath id="poolClip"><path d="M470,355 L960,355 L960,540 L470,540 Z"/></clipPath>
        <clipPath id="gateSlotClip"><rect x="414" y="292" width="52" height="108" rx="2"/></clipPath>
        <clipPath id="jetClip">
          <path d="M430,350 C460,355 500,385 535,430 C555,455 565,485 568,540 L455,540 C450,490 440,450 430,400 Z"/>
        </clipPath>
      </defs>

      <g clip-path="url(#frameClip)">

        <!-- ================= SKY & TERRAIN ================= -->
        <rect width="960" height="540" fill="url(#skyGrad)"/>
        <!-- far hills -->
        <path d="M0,150 Q80,120 160,145 T320,130 T480,150 T640,125 T800,145 T960,135 V220 H0 Z" fill="url(#hillFar)" opacity=".55"/>
        <path d="M0,175 Q120,150 220,170 T420,155 T620,175 T820,160 T960,170 V230 H0 Z" fill="url(#hillNear)" opacity=".7"/>

        <!-- left canyon / abutment rock -->
        <path d="M0,200 L90,210 L110,500 L0,500 Z" fill="url(#rockGrad)"/>
        <path d="M70,220 L95,225 L105,500 L85,500 Z" fill="#2e2a26" opacity=".35"/>
        <path d="M0,260 L60,268 L70,500 L0,500 Z" fill="#4a433c" opacity=".5"/>

        <!-- right canyon wall -->
        <path d="M960,250 L880,260 L860,540 L960,540 Z" fill="url(#rockGrad)"/>
        <path d="M900,280 L870,290 L855,540 L900,540 Z" fill="#2a2622" opacity=".4"/>

        <!-- ================= RESERVOIR ================= -->
        <g clip-path="url(#resClip)">
          <rect x="0" y="130" width="410" height="380" fill="url(#resDepthFixed)"/>
          <!-- deep tint near dam face -->
          <rect x="300" y="130" width="110" height="380" fill="#0c2a5c" opacity=".25"/>

          <!-- surface waves (seamless tiles) -->
          <path class="res-wave w3" fill="#8fdfff" opacity=".18"
            d="M-80,148 Q-40,136 0,148 T80,148 T160,148 T240,148 T320,148 T400,148 T480,148 V170 H-80 Z"/>
          <path class="res-wave w2" fill="#3aa0e0" opacity=".35"
            d="M-80,155 Q-40,140 0,155 T80,155 T160,155 T240,155 T320,155 T400,155 T480,155 V500 H-80 Z"/>
          <path class="res-wave w1" fill="#5ec8f0" opacity=".28"
            d="M-80,168 Q-40,152 0,168 T80,168 T160,168 T240,168 T320,168 T400,168 T480,168 V500 H-80 Z"/>

          <!-- specular sheen -->
          <ellipse cx="180" cy="160" rx="120" ry="10" fill="#eaf9ff" opacity=".14" filter="url(#softBlur)"/>
          <ellipse cx="280" cy="172" rx="70" ry="6" fill="#eaf9ff" opacity=".1" filter="url(#softBlur)"/>
        </g>

        <!-- reservoir shoreline left -->
        <path d="M0,200 Q40,195 70,205 L55,230 Q30,220 0,225 Z" fill="url(#bankGrad)" opacity=".85"/>

        <!-- ================= DAM STRUCTURE ================= -->
        <!-- main gravity dam body (slight batter) -->
        <g id="dam">
          <!-- downstream face shadow volume -->
          <path d="M448,95 L520,145 L535,500 L470,510 Z" fill="url(#damFaceSide)"/>

          <!-- upstream / main face -->
          <path d="M390,88 L448,95 L470,510 L398,500 Z" fill="url(#damFace)"/>
          <!-- formwork / lift lines -->
          <g opacity=".28" stroke="#2f343c" stroke-width="1.2">
            <path d="M396,150 L452,158"/>
            <path d="M397,190 L455,198"/>
            <path d="M398,230 L458,238"/>
            <path d="M399,270 L460,278"/>
            <path d="M400,310 L462,318"/>
            <path d="M401,350 L463,358"/>
            <path d="M402,390 L464,398"/>
            <path d="M403,430 L465,438"/>
            <path d="M404,470 L466,478"/>
          </g>
          <!-- form-tie dots -->
          <path d="M390,88 L448,95 L470,510 L398,500 Z" fill="url(#formTies)" opacity=".7"/>

          <!-- wet streak from leakage / spray staining -->
          <path d="M430,300 C433,340 438,400 442,500" fill="none" stroke="#4a90b8" stroke-width="10" opacity=".12" filter="url(#softBlur)"/>
          <path d="M418,320 C420,370 424,430 426,500" fill="none" stroke="#2a5a78" stroke-width="6" opacity=".1" filter="url(#softBlur)"/>

          <!-- crest roadway -->
          <path d="M378,82 L458,92 L462,108 L382,98 Z" fill="url(#crestGrad)"/>
          <path d="M378,82 L458,92 L456,96 L380,86 Z" fill="#dfe3ea"/>
          <!-- parapet -->
          <rect x="382" y="72" width="72" height="10" rx="1" fill="#9aa1ac"/>
          <rect x="382" y="70" width="72" height="3" fill="#cfd4dc"/>
          <!-- railing posts -->
          <g stroke="#d8dde5" stroke-width="2">
            <line x1="390" y1="62" x2="390" y2="72"/>
            <line x1="408" y1="61" x2="408" y2="72"/>
            <line x1="426" y1="60" x2="426" y2="72"/>
            <line x1="444" y1="60" x2="444" y2="72"/>
          </g>
          <line x1="388" y1="62" x2="446" y2="60" stroke="#e8ecf2" stroke-width="2"/>

          <!-- brand accent strip (subtle, engineered look) -->
          <rect x="402" y="118" width="10" height="300" fill="var(--indigo)" opacity=".55"/>
          <rect x="414" y="118" width="3" height="300" fill="var(--magenta)" opacity=".5"/>

          <!-- abutment wing left -->
          <path d="M360,100 L390,88 L398,500 L350,495 Z" fill="#6b717c" opacity=".9"/>
          <path d="M360,100 L390,88 L388,100 L362,110 Z" fill="#a0a6b0"/>

          <!-- sluice gate tower / guides -->
          <g id="gate-tower">
            <!-- guide slots -->
            <rect x="408" y="200" width="8" height="210" rx="1" fill="#2a2e38"/>
            <rect x="464" y="200" width="8" height="210" rx="1" fill="#2a2e38"/>
            <rect x="410" y="200" width="4" height="210" fill="#5a6378" opacity=".45"/>
            <rect x="466" y="200" width="4" height="210" fill="#5a6378" opacity=".45"/>

            <!-- hoist deck -->
            <rect x="400" y="188" width="80" height="16" rx="2" fill="#7a8290"/>
            <rect x="400" y="186" width="80" height="5" fill="#b0b7c2"/>
            <!-- hoist drums -->
            <rect x="412" y="170" width="22" height="18" rx="3" fill="#3a4050"/>
            <rect x="446" y="170" width="22" height="18" rx="3" fill="#3a4050"/>
            <circle cx="423" cy="179" r="6" fill="#1e2230" stroke="#8b93a5" stroke-width="1.5"/>
            <circle cx="457" cy="179" r="6" fill="#1e2230" stroke="#8b93a5" stroke-width="1.5"/>

            <!-- cables (scale down when gate rises) -->
            <g class="hoist-line">
              <line x1="423" y1="185" x2="423" y2="300" stroke="#c5cad4" stroke-width="2"/>
              <line x1="457" y1="185" x2="457" y2="300" stroke="#c5cad4" stroke-width="2"/>
            </g>
          </g>

          <!-- gate opening (dark throat) -->
          <rect x="414" y="292" width="52" height="108" rx="2" fill="#0a0c12"/>
          <!-- throat inner sill -->
          <rect x="414" y="392" width="52" height="8" fill="#1a2030"/>
          <!-- pink inspection trim (brand) -->
          <rect x="414" y="292" width="52" height="108" rx="2" fill="none" stroke="var(--pink)" stroke-width="2" opacity=".55"/>

          <!-- water visible in throat when closed slightly seeping look handled by gate -->
        </g>

        <!-- ================= GATE LEAF ================= -->
        <g clip-path="url(#gateSlotClip)">
          <!-- residual water glint behind gate when open -->
          <rect x="414" y="292" width="52" height="108" fill="#1a6aaa" opacity=".55"/>
          <rect x="414" y="292" width="52" height="108" fill="url(#jetGrad)" opacity=".25"/>
        </g>

        <g class="gate-leaf">
          <rect x="416" y="294" width="48" height="104" rx="1.5" fill="url(#gateSteel)"/>
          <rect x="416" y="294" width="48" height="104" rx="1.5" fill="url(#gateRibs)"/>
          <!-- vertical stiffeners -->
          <rect x="424" y="296" width="3" height="100" fill="#8b93a5" opacity=".35"/>
          <rect x="453" y="296" width="3" height="100" fill="#8b93a5" opacity=".35"/>
          <!-- top seal bar -->
          <rect x="416" y="294" width="48" height="7" fill="#5ec8f0" opacity=".75"/>
          <rect x="416" y="300" width="48" height="2" fill="#0d0f16" opacity=".5"/>
          <!-- bottom seal -->
          <rect x="416" y="390" width="48" height="6" fill="#1a1d28"/>
          <!-- center lifting eye -->
          <circle cx="440" cy="308" r="4" fill="none" stroke="#9aa3b5" stroke-width="1.6"/>
        </g>

        <!-- ================= RELEASE JET ================= -->
        <g class="stream-group">
          <!-- solid water nappe / jet body -->
          <path class="jet-core" d="M440,350
               C455,352 475,365 498,392
               C515,412 528,438 538,470
               C542,485 545,500 546,520
               L500,525
               C495,490 485,455 470,425
               C455,395 445,370 440,350 Z"
                fill="url(#jetGrad)" opacity=".8" filter="url(#waterBlur)"/>

          <!-- white aerated edge -->
          <path d="M442,348 C458,350 478,364 500,390 C512,408 522,430 530,458"
                fill="none" stroke="#eaf9ff" stroke-width="5" opacity=".45" stroke-linecap="round" filter="url(#softBlur)"/>
          <path class="sheet-line" d="M446,355 C465,362 488,382 510,415 C522,435 532,460 538,490"
                fill="none" stroke="#ffffff" stroke-width="2" opacity=".4"/>
          <path class="sheet-line l2" d="M450,360 C468,370 490,395 512,430"
                fill="none" stroke="#b8f0ff" stroke-width="1.5" opacity=".35"/>

          <!-- fast streaks (entrained bubbles / shear) -->
          <g clip-path="url(#jetClip)">
            <g class="streak s1"><g transform="translate(448,360) rotate(52)"><rect x="-10" y="-1.2" width="22" height="2.4" rx="1" fill="#eaf9ff"/></g></g>
            <g class="streak s2"><g transform="translate(448,360) rotate(52)"><rect x="-8" y="-1" width="18" height="2" rx="1" fill="#ffffff"/></g></g>
            <g class="streak s3"><g transform="translate(448,360) rotate(53)"><rect x="-11" y="-1" width="24" height="2" rx="1" fill="#9ae8ff"/></g></g>
            <g class="streak s4"><g transform="translate(448,360) rotate(51"><rect x="-9" y="-1.1" width="20" height="2.2" rx="1" fill="#eaf9ff"/></g></g>
            <g class="streak s5"><g transform="translate(448,360) rotate(54)"><rect x="-7" y="-0.9" width="16" height="1.8" rx="1" fill="#ffffff"/></g></g>
            <g class="streak s6"><g transform="translate(448,360) rotate(52)"><rect x="-10" y="-1" width="21" height="2" rx="1" fill="#7adfff"/></g></g>

          <!-- spray / atomized mist at vena contracta -->
          <g filter="url(#mistBlur)">

        </g>

        <!-- ================= STILLING BASIN / TAILRACE ================= -->
        <g clip-path="url(#poolClip)">
          <rect x="470" y="355" width="490" height="185" fill="url(#poolDepth)"/>

          <!-- concrete apron under water -->
          <path d="M470,430 L620,425 L700,440 L700,540 L470,540 Z" fill="#4a505a" opacity=".25"/>

          <path class="pool-wave w2" fill="#1e5a9a" opacity=".4"

          <path class="pool-wave w1" fill="#3eb4e8" opacity=".3"
            d="M450,412 Q480,396 510,412 T570,412 T630,412 T690,412 T750,412 T810,412 T870,412 T930,412 T990,412 V540 H450 Z"/>

          <!-- impact zone turbulence -->
          <g class="stream-group">
            <!-- hydraulic jump boil -->
            <ellipse class="boil b1" cx="545" cy="448" rx="48" ry="16" fill="#eaf9ff" opacity=".35" filter="url(#softBlur)"/>
            <ellipse class="boil b2" cx="560" cy="455" rx="36" ry="12" fill="#8fdfff" opacity=".3" filter="url(#softBlur)"/>
            <ellipse class="boil b3" cx="530" cy="458" rx="28" ry="10" fill="#ffffff" opacity=".22" filter="url(#softBlur)"/>

            <!-- splash rings -->
            <ellipse class="splash-ring r1" cx="542" cy="442" rx="30" ry="11" fill="none" stroke="#eaf9ff" stroke-width="2.2"/>

            <circle class="splash-drop d5" style="--dx:18px" cx="568" cy="436" r="2.4" fill="#ffffff"/>

            <!-- drifting foam -->
            <ellipse class="foam-patch f1" cx="580" cy="460" rx="26" ry="5" fill="#eaf9ff" opacity=".35"/>
            <ellipse class="foam-patch f2" cx="620" cy="468" rx="32" ry="4" fill="#d4f6ff" opacity=".28"/>

        <!-- downstream bank / riprap suggestion -->
        <path d="M700,470 L960,455 L960,540 L700,540 Z" fill="#3a342e" opacity=".35"/>

    <div class="toggle" id="toggle" role="button" aria-pressed="true" aria-label="Toggle dam release">
      <span class="toggle-label" id="toggleLabel">RELEASE</span>
      <div class="thumb">
        <svg viewBox="0 0 24 24"><path d="M12 3c-3 4-6 7.2-6 10.5A6 6 0 0 0 18 13.5C18 10.2 15 7 12 3Z"/></svg>
      </div>
    </div>
  </div>
</div>

<script>
  const scene = document.getElementById('scene');
  const toggle = document.getElementById('toggle');
  const label = document.getElementById('toggleLabel');

  function setState(on){
    scene.classList.toggle('on', on);
    scene.classList.toggle('off', !on);
    toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
    label.textContent = on ? 'RELEASE' : 'STOP';
  }

  toggle.addEventListener('click', ()=>{
    setState(!scene.classList.contains('on'));
  });

  setState(true);
</script>

</body>
</html>
